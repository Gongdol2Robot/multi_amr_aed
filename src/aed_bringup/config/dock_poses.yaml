# 각 로봇의 Dock 대기 위치. 공용 지도(maps/map.yaml) 좌표계 기준이다.
#
# 로봇 두 대가 서로 다른 Dock에서 출발하지만 지도는 하나를 공유한다.
# 그래서 지도는 공통이고, 초기 위치만 로봇마다 다르게 준다.
# 이 값이 있어야 AMCL이 전역 탐색 없이 바로 수렴한다.
#
# 측정 방법 (로봇을 Dock에 올려둔 상태에서):
#   1. loc <n>                     공용 지도로 localization 실행
#   2. initpose <n>                기존 값을 초기 추정으로 발행
#   3. 수렴이 안 되면 전역 위치추정 후 제자리 회전으로 수렴시킨다
#        ros2 service call /robot<n>/reinitialize_global_localization \
#          std_srvs/srv/Empty '{}'
#   4. fit <n>                     정합률 80% 이상인지 확인
#   5. initpose <n> --record       확정된 위치를 여기에 기록
#
# 지도를 다시 만들면 좌표계 원점이 바뀌므로 이 값도 전부 다시 재야 한다.

robots:
  robot1:
    # 실측 확정. 2026-08-06, 도킹 상태에서 정합률 100%로 기록.
    #
    # 참고로 이 값을 찾기 전 초기 추정은 지도 정렬로 구했다.
    #   tools/align_maps.py maps/map1.yaml maps/map.yaml
    #   회전 +8.00 deg, 평행이동 (-0.550, -0.050), 벽 정합률 89.2%
    # robot1이 만든 map1을 공용 지도에 겹쳐 좌표계 변환을 복원한 것이다.
    # 실측 결과가 그 예측과 가까워 지도 정렬 방법도 함께 검증됐다.
    measured: true
    x: -0.5760
    y: 0.1372
    yaw_deg: 5.3

  robot2:
    # 실측 확정. 2026-08-06, 도킹 상태에서 정합률 98.4%로 기록.
    #
    # 이 지도(map2)를 robot2의 SLAM으로 만들었으므로 SLAM 시작 위치가
    # 원점 (0, 0)이고, Dock은 그 바로 옆이다. 실측값도 그와 일치한다.
    #
    # 두 로봇의 yaw가 5.3도와 186.4도로 정반대인 것은 언독 동작 때문이
    # 아니라 두 Dock이 서로 반대 방향을 보고 놓여 있기 때문이다.
    measured: true
    x: -0.0465
    y: 0.0490
    yaw_deg: 186.4

# AMCL 초기 공분산. 값이 작을수록 준 위치를 강하게 믿는다.
# 실측으로 확정된 뒤에는 줄여도 되지만, 추정값 단계에서는 넉넉히 둔다.
covariance:
  xy: 0.25
  yaw: 0.0685

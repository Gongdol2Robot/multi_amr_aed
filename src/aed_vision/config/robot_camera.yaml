/**/vision_detector:
  ros__parameters:
    # TurtleBot4 OAK-D의 압축 영상 토픽을 구독하므로 카메라를 직접 열지 않는다.
    direct_camera: false
    # TurtleBot CDR 경로로 들어오는 작은 preview sensor_msgs/Image를 사용한다.
    image_is_compressed: false
    width: 640
    height: 480
    # 실제 발행률은 로봇 OAK-D의 rgb.i_fps=7.0 설정에서 제어한다.
    # 구독 노드는 들어오는 7 FPS를 버리지 않고 모두 추론한다.
    fps: 7.0
    jpeg_quality: 85
    mode: robot

    # 기본은 실제 사람 Pose 판정이며 mannequin_detect 인자에서 rescue를 쓴다.
    detection_backend: person_pose
    rescue_weights: package://aed_vision/models/rescue_yolo11n.pt
    person_weights: package://aed_vision/models/coco_yolo11n.pt
    pose_weights: package://aed_vision/models/yolo11n-pose.pt
    rescue_conf: 0.25
    person_conf: 0.5
    pose_keypoint_conf: 0.3
    pose_min_keypoints: 8
    pose_min_box_area: 0.02
    pose_min_torso_keypoints: 3
    detect_people_as_helpers: true
    iou: 0.5
    imgsz: 640
    inference_device: ""

    confirmation_window: 10
    confirmation_hits: 6
    helper_confirmation_window: 6
    helper_confirmation_hits: 3
    # 조력자 하단 중심과 환자 중심 거리: 화면 대각선의 30% 이내.
    helper_max_distance_ratio: 0.30
    crowd_roi: [0.0, 0.0, 1.0, 1.0]
    crowded_person_threshold: 3
    fallen_person_overlap_iou: 0.4

    location_frame_id: map
    location_x: 0.0
    location_y: 0.0
    homography_camera_id: ""
    homography_margin_m: 0.15
    publish_debug_image: true
    show_window: false
    debug_jpeg_quality: 80

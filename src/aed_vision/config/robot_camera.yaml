/**/vision_detector:
  ros__parameters:
    # TurtleBot4 OAK-D가 발행하는 토픽을 구독하므로 카메라를 직접
    # 열거나 라즈베리파이에 추론을 설치하지 않는다.
    direct_camera: false
    # 비압축 preview(약 17Mbps)는 로봇 WiFi 실효 대역폭을 초과해 핑을
    # 망가뜨리므로, 로봇이 발행하는 704x704 JPEG(image_raw/compressed)를 쓴다.
    image_is_compressed: true
    width: 640
    height: 480
    # 실제 발행률은 로봇 OAK-D의 rgb.i_fps=7.0 설정에서 제어한다.
    fps: 7.0
    jpeg_quality: 85
    mode: robot
    # 배정으로 비전을 켠 직후 첫 프레임이 이 시간 동안 없을 때만 OAK-D
    # 구독을 다시 만든다. 첫 프레임 수신 뒤에는 watchdog이 개입하지 않는다.
    image_first_frame_timeout_seconds: 3.0

    # 모델 종류는 launch가 mannequin_backend.yaml 또는
    # person_pose_backend.yaml에서 별도로 불러온다.
    rescue_conf: 0.25
    pose_keypoint_conf: 0.3
    pose_min_keypoints: 8
    pose_min_box_area: 0.02
    pose_min_torso_keypoints: 3
    # 빈 값은 Ultralytics가 실행 환경에 맞춰 GPU 또는 CPU를 자동 선택하게 한다.
    inference_device: ""

    homography_camera_id: ""
    show_window: false

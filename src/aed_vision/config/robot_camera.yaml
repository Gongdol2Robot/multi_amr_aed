/**/vision_detector:
  ros__parameters:
    # TurtleBot4 OAK-D의 압축 영상 토픽을 구독하므로 카메라를 직접 열지 않는다.
    direct_camera: false
    width: 640
    height: 480
    fps: 15.0
    jpeg_quality: 85
    mode: robot

    # fallen_person과 COCO person을 함께 검출한다. fallen_person과 겹치지 않는
    # person만 구조 인력 후보로 사용해 환자를 구조 인력으로 세지 않는다.
    rescue_weights: package://aed_vision/models/rescue_yolo11n.pt
    person_weights: package://aed_vision/models/coco_yolo11n.pt
    rescue_conf: 0.25
    person_conf: 0.35
    detect_people_as_helpers: true
    iou: 0.5
    imgsz: 640
    inference_device: ""

    confirmation_window: 10
    confirmation_hits: 6
    helper_confirmation_window: 6
    helper_confirmation_hits: 3
    crowd_roi: [0.0, 0.0, 1.0, 1.0]
    crowded_person_threshold: 3
    fallen_person_overlap_iou: 0.4

    location_frame_id: map
    location_x: 0.0
    location_y: 0.0
    homography_camera_id: ""
    homography_margin_m: 0.15
    publish_debug_image: true
    show_window: false
    debug_jpeg_quality: 80

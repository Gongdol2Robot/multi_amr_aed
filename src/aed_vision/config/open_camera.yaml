/camera_open/vision_detector:
  ros__parameters:
    # 개방 구역 노트북에 연결된 USB 웹캠을 직접 읽는다.
    direct_camera: true
    camera_device: auto
    fps: 10.0
    frame_id: camera_open_optical_frame
    camera_id: camera_open
    zone_id: open_zone
    mode: open
    image_topic: /camera_open/image_raw/compressed

    # 고정 카메라에서 Pose를 켤 때 사용할 현장 품질 기준이다.
    pose_keypoint_conf: 0.5
    pose_min_keypoints: 5
    pose_min_box_area: 0.005
    pose_min_torso_keypoints: 2
    inference_device: "cuda:0"

    homography_camera_id: cam1
    show_window: true

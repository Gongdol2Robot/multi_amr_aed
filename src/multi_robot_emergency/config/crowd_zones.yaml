emergency_mission_manager:
  ros__parameters:
    # Camera2 owns the 0..3 classification. The central node maps those
    # numeric strings to these AMR-owned names and applies only the speed
    # table below; vision's crowd_time_multiplier is not applied again.
    crowd_level_names: ["CLEAR", "BUSY", "CROWDED", "BLOCKED"]
    crowd_state_timeout_sec: 2.0
    crowd_increase_confirm_sec: 0.5
    crowd_decrease_hold_sec: 1.5

    # Camera2 alley polygon in the shared map frame (flat x,y pairs).
    # 2026-08-07 현장 측량 네 점을 모두 포함하는 회전 외접 직사각형이다.
    # 골목 장축은 map X축 기준 +10.58deg이며 측량한 위쪽 장변과 평행하다.
    crowd_zone_polygon:
      [-3.0420, 1.6450,
       -2.8859, 0.8092,
       -1.0119, 1.1592,
       -1.1680, 1.9950]

    # One speed for each stage above. BLOCKED excludes a candidate path that
    # intersects the zone; its speed is retained only for list consistency.
    crowd_level_speeds_mps: [0.20, 0.15, 0.10, 0.05]
    crowd_blocking_level: 3
    # BLOCKED일 때 Nav2 keepout mask를 실제 ROI보다 로봇 반경만큼 넓힌다.
    crowd_keepout_margin_m: 0.22
    crowd_keepout_settle_sec: 1.2

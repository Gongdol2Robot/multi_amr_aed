<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Multi-AMR Emergency AED Response System Architecture</title>
  <desc id="desc">Fixed cameras detect an emergency, a central ROS 2 computer compares paths and dispatches two TurtleBot 4 robots, while recovery, helper mission, alerts and HMI observe the mission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2672a7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#db7b24"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d8a67"/>
    </marker>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#16324a}.subtitle{font:400 15px Arial,sans-serif;fill:#577084}
      .group{font:700 18px Arial,sans-serif;fill:#17384f}.box-title{font:700 16px Arial,sans-serif;fill:#17384f}
      .box-sub{font:400 12px Arial,sans-serif;fill:#516879}.topic{font:600 11px Arial,sans-serif;fill:#2672a7}
      .tiny{font:400 11px Arial,sans-serif;fill:#617787}.stage{font:700 12px Arial,sans-serif;letter-spacing:1px}
      .card{fill:#fff;stroke:#cad8e2;stroke-width:1.5;rx:14;filter:url(#shadow)}
      .edge{fill:none;stroke:#2672a7;stroke-width:2.5;marker-end:url(#arrow-blue)}
      .action{fill:none;stroke:#db7b24;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-orange)}
      .status{fill:none;stroke:#2d8a67;stroke-width:2.3;stroke-dasharray:3 5;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="720" y="48" text-anchor="middle" class="title">Multi-AMR Emergency AED Response System</text>
  <text x="720" y="74" text-anchor="middle" class="subtitle">ROS 2 Humble · TurtleBot 4 × 2 · Vision-driven dispatch · Nav2 · Recovery · Web HMI</text>

  <!-- stage labels -->
  <rect x="45" y="98" width="255" height="34" rx="17" fill="#dff2ee"/><text x="172" y="120" text-anchor="middle" class="stage" fill="#24745b">01 PERCEPTION</text>
  <rect x="340" y="98" width="500" height="34" rx="17" fill="#e2edf7"/><text x="590" y="120" text-anchor="middle" class="stage" fill="#245f8c">02 DECISION &amp; MONITORING</text>
  <rect x="880" y="98" width="515" height="34" rx="17" fill="#fff0df"/><text x="1137" y="120" text-anchor="middle" class="stage" fill="#a65d1e">03 ROBOT CONTROL</text>

  <!-- perception -->
  <rect class="card" x="45" y="155" width="255" height="178"/>
  <circle cx="83" cy="195" r="21" fill="#dff2ee" stroke="#2d8a67" stroke-width="2"/>
  <path d="M70 188h21v15H70z M91 192l10-6v19l-10-6z" fill="none" stroke="#2d8a67" stroke-width="2"/>
  <text x="116" y="191" class="box-title">Fixed Cameras</text><text x="116" y="211" class="box-sub">camera_open · camera_alley</text>
  <rect x="65" y="231" width="215" height="78" rx="9" fill="#eff9f6" stroke="#a8d8c9"/>
  <text x="78" y="252" class="box-title">aed_vision</text>
  <text x="78" y="272" class="box-sub">YOLO / Pose · posture · crowd ROI</text>
  <text x="78" y="291" class="box-sub">homography → map coordinates</text>

  <rect class="card" x="45" y="365" width="255" height="132"/>
  <text x="65" y="396" class="box-title">Vision outputs</text>
  <text x="65" y="422" class="topic">/aed/emergency_event</text>
  <text x="65" y="444" class="topic">/aed/crowd_level</text>
  <text x="65" y="466" class="topic">DetectionSummary · debug video</text>

  <!-- central -->
  <rect class="card" x="340" y="155" width="500" height="450"/>
  <text x="365" y="187" class="group">Central PC · aed_bringup/server_runtime</text>
  <rect x="365" y="210" width="450" height="112" rx="11" fill="#edf5fc" stroke="#9fc4df" stroke-width="1.5"/>
  <text x="387" y="238" class="box-title">multi_robot_emergency</text>
  <text x="387" y="260" class="box-sub">Nav2 path request → distance / calibrated ETA comparison</text>
  <text x="387" y="281" class="box-sub">single or dual dispatch · live replan · proximity cancellation</text>
  <text x="387" y="302" class="box-sub">patient standoff goal · assignment version · return policy</text>

  <rect x="365" y="342" width="214" height="96" rx="11" fill="#f7f1fb" stroke="#c8a8db"/>
  <text x="386" y="370" class="box-title">aed_hmi</text>
  <text x="386" y="392" class="box-sub">ROS bridge · FastAPI</text><text x="386" y="412" class="box-sub">WebSocket · React dashboard</text>
  <rect x="601" y="342" width="214" height="96" rx="11" fill="#fff6e9" stroke="#e5bd82"/>
  <text x="622" y="370" class="box-title">emergency_alert</text>
  <text x="622" y="392" class="box-sub">MissionStatus-driven</text><text x="622" y="412" class="box-sub">voice · buzzer · audio routing</text>

  <rect x="365" y="458" width="214" height="110" rx="11" fill="#eef8f4" stroke="#a8d8c9"/>
  <text x="386" y="486" class="box-title">robot_state_monitor</text>
  <text x="386" y="508" class="box-sub">pose · battery · health</text><text x="386" y="528" class="box-sub">diagnostic path cost</text><text x="386" y="548" class="box-sub">RobotState → HMI / dispatch</text>
  <rect x="601" y="458" width="214" height="110" rx="11" fill="#fff2f1" stroke="#e5aba5"/>
  <text x="622" y="486" class="box-title">helper_mission</text>
  <text x="622" y="508" class="box-sub">request nearby responder</text><text x="622" y="528" class="box-sub">guide helper to patient</text><text x="622" y="548" class="box-sub">handoff → robot return</text>

  <!-- robots -->
  <rect class="card" x="880" y="155" width="515" height="258"/>
  <text x="905" y="187" class="group">Robot PCs · shared DDS discovery</text>
  <rect x="905" y="210" width="220" height="175" rx="12" fill="#fff8ed" stroke="#e5bd82" stroke-width="1.5"/>
  <circle cx="936" cy="242" r="17" fill="#fff" stroke="#db7b24" stroke-width="2"/><text x="936" y="248" text-anchor="middle" class="box-title">1</text>
  <text x="964" y="247" class="box-title">robot1</text>
  <text x="925" y="278" class="box-sub">mission_executor → Nav2</text>
  <text x="925" y="300" class="box-sub">AMCL · planner · controller</text>
  <text x="925" y="322" class="box-sub">LiDAR / OAK-D / battery</text>
  <text x="925" y="344" class="box-sub">AED delivery or helper role</text>
  <text x="925" y="367" class="topic">/robot1/* namespace</text>
  <rect x="1150" y="210" width="220" height="175" rx="12" fill="#fff8ed" stroke="#e5bd82" stroke-width="1.5"/>
  <circle cx="1181" cy="242" r="17" fill="#fff" stroke="#db7b24" stroke-width="2"/><text x="1181" y="248" text-anchor="middle" class="box-title">2</text>
  <text x="1209" y="247" class="box-title">robot2</text>
  <text x="1170" y="278" class="box-sub">mission_executor → Nav2</text>
  <text x="1170" y="300" class="box-sub">AMCL · planner · controller</text>
  <text x="1170" y="322" class="box-sub">LiDAR / OAK-D / battery</text>
  <text x="1170" y="344" class="box-sub">AED delivery or helper role</text>
  <text x="1170" y="367" class="topic">/robot2/* namespace</text>

  <rect class="card" x="880" y="445" width="515" height="160"/>
  <text x="905" y="477" class="group">sensor_recovery · per robot</text>
  <rect x="905" y="495" width="140" height="82" rx="9" fill="#fff2f1" stroke="#e5aba5"/>
  <text x="975" y="520" text-anchor="middle" class="box-title">LiDAR watchdog</text><text x="975" y="542" text-anchor="middle" class="box-sub">ALIVE / FAULT</text><text x="975" y="560" text-anchor="middle" class="box-sub">RECOVERING</text>
  <rect x="1060" y="495" width="140" height="82" rx="9" fill="#fff6e9" stroke="#e5bd82"/>
  <text x="1130" y="520" text-anchor="middle" class="box-title">Control handoff</text><text x="1130" y="542" text-anchor="middle" class="box-sub">cancel Nav2</text><text x="1130" y="560" text-anchor="middle" class="box-sub">exclusive cmd_vel</text>
  <rect x="1215" y="495" width="155" height="82" rx="9" fill="#eef8f4" stroke="#a8d8c9"/>
  <text x="1292" y="520" text-anchor="middle" class="box-title">Fallback drive</text><text x="1292" y="542" text-anchor="middle" class="box-sub">odom + saved path</text><text x="1292" y="560" text-anchor="middle" class="box-sub">OAK-D depth stop</text>

  <!-- arrows -->
  <path class="edge" d="M300 270 H340"/><text x="320" y="256" text-anchor="middle" class="topic">events</text>
  <path class="edge" d="M840 260 H875"/><text x="857" y="246" text-anchor="middle" class="topic">plan</text>
  <path class="action" d="M840 310 H860 V342 H900"/><text x="873" y="326" class="tiny" fill="#a65d1e">assignment</text>
  <path class="action" d="M840 330 H850 V365 H1150"/>
  <path class="status" d="M905 395 V625 H580 V568"/><text x="716" y="644" text-anchor="middle" class="tiny" fill="#24745b">RobotState · MissionStatus · SensorHealth · images</text>
  <path class="status" d="M1260 395 V650 H708 V568"/>
  <path class="status" d="M1137 445 V413"/><text x="1150" y="435" class="tiny" fill="#24745b">health</text>

  <!-- scenario strip -->
  <rect x="45" y="690" width="1350" height="145" rx="16" fill="#17384f"/>
  <text x="70" y="723" class="group" fill="#fff">Mission lifecycle</text>
  <g>
    <circle cx="130" cy="774" r="27" fill="#2d8a67"/><text x="130" y="779" text-anchor="middle" class="box-title" fill="#fff">01</text><text x="130" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">DETECT</text>
    <path d="M160 774 H294" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="330" cy="774" r="27" fill="#2672a7"/><text x="330" y="779" text-anchor="middle" class="box-title" fill="#fff">02</text><text x="330" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">CONFIRM</text>
    <path d="M360 774 H494" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="530" cy="774" r="27" fill="#2672a7"/><text x="530" y="779" text-anchor="middle" class="box-title" fill="#fff">03</text><text x="530" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">COMPARE ETA</text>
    <path d="M560 774 H694" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="730" cy="774" r="27" fill="#db7b24"/><text x="730" y="779" text-anchor="middle" class="box-title" fill="#fff">04</text><text x="730" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">DISPATCH</text>
    <path d="M760 774 H894" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="930" cy="774" r="27" fill="#db7b24"/><text x="930" y="779" text-anchor="middle" class="box-title" fill="#fff">05</text><text x="930" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">DELIVER AED</text>
    <path d="M960 774 H1094" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="1130" cy="774" r="27" fill="#8b62a8"/><text x="1130" y="779" text-anchor="middle" class="box-title" fill="#fff">06</text><text x="1130" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">GUIDE HELPER</text>
    <path d="M1160 774 H1264" stroke="#8fb0c4" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="1300" cy="774" r="27" fill="#2d8a67"/><text x="1300" y="779" text-anchor="middle" class="box-title" fill="#fff">07</text><text x="1300" y="817" text-anchor="middle" class="tiny" fill="#dce8ef">RETURN</text>
  </g>
  <text x="45" y="875" class="tiny">Solid blue: Topic / data flow</text><text x="250" y="875" class="tiny" fill="#a65d1e">Dashed orange: command / action</text><text x="500" y="875" class="tiny" fill="#24745b">Dotted green: state / telemetry</text><text x="1395" y="875" text-anchor="end" class="tiny">Source: repository packages and launch configuration · 2026-08</text>
</svg>

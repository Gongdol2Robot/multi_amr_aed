[global_config]
[keybindings]
[profiles]
  [[default]]
    scrollback_infinite = True
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
  [[robot_session]]
    [[[window0]]]
      type = Window
      parent = ""
      title = Multi-AMR AED robot session
    [[[rows]]]
      type = VPaned
      parent = window0
      order = 0
      position = 360
      ratio = 0.333333
    [[[row_top]]]
      type = HPaned
      parent = rows
      order = 0
      position = 960
      ratio = 0.5
    [[[rows_lower]]]
      type = VPaned
      parent = rows
      order = 1
      position = 360
      ratio = 0.5
    [[[row_middle]]]
      type = HPaned
      parent = rows_lower
      order = 0
      position = 960
      ratio = 0.5
    [[[row_bottom]]]
      type = HPaned
      parent = rows_lower
      order = 1
      position = 960
      ratio = 0.5
    [[[undock]]]
      type = Terminal
      parent = row_top
      order = 0
      profile = default
      title = undock
      command = '''bash -lc 'source ~/.bashrc; undock "${ROBOT_NUMBER:-2}"; exec bash''''
    [[[localization]]]
      type = Terminal
      parent = row_top
      order = 1
      profile = default
      title = localization
      command = '''bash -lc 'source ~/.bashrc; loc "${ROBOT_NUMBER:-2}"; exec bash''''
    [[[initial_pose]]]
      type = Terminal
      parent = row_middle
      order = 0
      profile = default
      title = initial pose
      command = '''bash -lc 'source ~/.bashrc; sleep 10; initpose "${ROBOT_NUMBER:-2}"; exec bash''''
    [[[navigation]]]
      type = Terminal
      parent = row_middle
      order = 1
      profile = default
      title = navigation
      command = '''bash -lc 'source ~/.bashrc; sleep 14; nav "${ROBOT_NUMBER:-2}"; exec bash''''
    [[[rviz]]]
      type = Terminal
      parent = row_bottom
      order = 0
      profile = default
      title = RViz2
      command = '''bash -lc 'source ~/.bashrc; sleep 20; rv "${ROBOT_NUMBER:-2}"; exec bash''''
    [[[detection]]]
      type = Terminal
      parent = row_bottom
      order = 1
      profile = default
      title = AED vision
      command = '''bash -lc 'source ~/.bashrc; sleep 20; vision "${WEBCAM_DEVICE:-0}"; exec bash''''
[plugins]
